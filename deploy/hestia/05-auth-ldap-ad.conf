# Place at /etc/dovecot/conf.d/05-auth-ldap-ad.conf
# The 05- prefix sorts before 10-auth.conf, so this AD passdb is tried BEFORE
# Hestia's passwd-file. Clients fall through to the passwd-file; result_internalfail
# = continue means an AD outage never blocks client-domain logins.
passdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap-ad.conf.ext
  result_internalfail = continue
}
