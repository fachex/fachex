/* SOGo configuration — opennube profile.
   Template: __PG_PASS__ and __TZ__ are filled by install-sogo.sh.
   GNUstep plist syntax. See docs/opennube-config.md for the rationale. */
{
  /* --- SOGo's own datastore (prefs, calendars, contacts, sessions) --------
     This is PostgreSQL on the LXC. It does NOT hold mail (that's Hestia). */
  SOGoProfileURL          = "postgresql://sogo:__PG_PASS__@127.0.0.1:5432/sogo/sogo_user_profile";
  OCSFolderInfoURL        = "postgresql://sogo:__PG_PASS__@127.0.0.1:5432/sogo/sogo_folder_info";
  OCSSessionsFolderURL    = "postgresql://sogo:__PG_PASS__@127.0.0.1:5432/sogo/sogo_sessions_folder";
  OCSEMailAlarmsFolderURL = "postgresql://sogo:__PG_PASS__@127.0.0.1:5432/sogo/sogo_alarms_folder";
  SOGoMemcachedHost       = "127.0.0.1";

  /* --- Listener ------------------------------------------------------------
     Bind to all interfaces so the (remote) front nginx can reach it.
     IMPORTANT: firewall tcp/20000 to the nginx proxy IP only. */
  WOPort         = "0.0.0.0:20000";
  WOWorkersCount = 5;

  /* --- Branding / locale --------------------------------------------------- */
  SOGoPageTitle  = "OpenNube Mail";
  SOGoTimeZone   = "__TZ__";
  SOGoLanguage   = "English";
  SOGoMailDomain = "opennube.net";
  SOGoMailAuxiliaryUserAccountsEnabled = YES;   /* additional domain inboxes (@opennube.ai, …) */

  /* --- Mail plumbing to Hestia (Phase 2) -----------------------------------
     Replace MAILHOST with your Hestia server hostname/IP. Keep TLS on. */
  SOGoIMAPServer  = "imaps://mail.opennube.net:993";
  SOGoSMTPServer  = "smtp://mail.opennube.net:587/?tls=YES";
  SOGoSieveServer = "sieve://mail.opennube.net:4190";
  SOGoMailingMechanism       = "smtp";
  SOGoSMTPAuthenticationType = "PLAIN";

  /* Identity-vs-mailbox domain split (see docs/opennube-config.md):
     AD mail is @opennube.com (M365), but the mailbox is @opennube.net.
     We key on sAMAccountName: SOGo sends the bare username to IMAP and
     Hestia's Dovecot maps it to <user>@opennube.net via auth_default_realm. */
  SOGoForceExternalLoginWithEmail = NO;

  /* --- Quality of life ----------------------------------------------------- */
  SOGoMailCustomFromEnabled    = YES;   /* send-as aliases */
  SOGoTrustProxyAuthentication = NO;
  SOGoXSRFValidationEnabled    = YES;

  /* --- Active Directory: authentication + Global Address List (Phase 3) ----
     Fill bindPassword with the svc-mail account password. */
  SOGoUserSources = (
    {
      type         = ldap;
      id           = "ad-opennube";
      hostname     = "ldaps://ONAD1.opennube.local";
      baseDN       = "OU=OpenNube Co,DC=opennube,DC=local";
      bindDN       = "CN=svc-mail,OU=Service Accounts,DC=opennube,DC=local";
      bindPassword = "CHANGE_ME_AD_BIND";
      UIDFieldName = "sAMAccountName";
      IDFieldName  = "sAMAccountName";
      bindFields   = ("sAMAccountName", "userPrincipalName");
      MailFieldNames = ("mail", "proxyAddresses");
      canAuthenticate = YES;
      isAddressBook   = YES;
      displayName     = "OpenNube Directory";
      groupObjectClasses = ("group");
      MembershipFieldName = "member";
    }
  );
}
