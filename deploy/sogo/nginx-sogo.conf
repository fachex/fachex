# SOGo front-end nginx — runs INSIDE container 902 (where the SOGo files live).
# The SOGo daemon (127.0.0.1:20000) does NOT serve WebServerResources; this
# nginx serves those static assets locally and proxies the app to the daemon.
# Public TLS is terminated upstream on the dedicated proxy, which forwards here
# with Host + X-Forwarded-Proto:https, so we emit https:// WebObjects URLs.
#
# NOTE: the SOGo package pulls in apache2, which grabs :80. Disable it first:
#           systemctl disable --now apache2
# Install:  apt-get install -y nginx
#           cp nginx-sogo.conf /etc/nginx/sites-available/sogo
#           ln -sf ../sites-available/sogo /etc/nginx/sites-enabled/sogo
#           rm -f /etc/nginx/sites-enabled/default
#           nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;
    client_body_buffer_size 128k;

    location = / { rewrite ^ /SOGo permanent; }
    location = /principals { rewrite ^ /SOGo/dav permanent; }

    # The SOGo application -> daemon
    location ^~ /SOGo {
        proxy_pass http://127.0.0.1:20000;
        proxy_redirect http://127.0.0.1:20000 default;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header x-webobjects-server-protocol HTTP/1.0;
        proxy_set_header x-webobjects-remote-host $remote_addr;
        proxy_set_header x-webobjects-server-name $host;
        # Public scheme/port (TLS terminated on the upstream proxy):
        proxy_set_header x-webobjects-server-url https://$host;
        proxy_set_header x-webobjects-server-port 443;

        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        break;
    }

    # Static assets served from local files (THIS is what fixes the unstyled page)
    location /SOGo.woa/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }
    location /SOGo/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }
    # Per-module (Mailer/Contacts/Scheduler…) UI resources
    location ~* ^/SOGo/so/ControlPanel/Products/([^/]*)/Resources/(.*)\.(jpg|jpeg|gif|png|svg|css|js|eot|ttf|woff|woff2)$ {
        alias /usr/lib/GNUstep/SOGo/$1.SOGo/Resources/$2.$3;
    }

    # ActiveSync for phones (long-lived)
    location /Microsoft-Server-ActiveSync {
        access_log off;
        proxy_pass http://127.0.0.1:20000/SOGo/Microsoft-Server-ActiveSync;
        proxy_set_header Host $host;
        proxy_set_header x-webobjects-server-url https://$host;
        proxy_connect_timeout 3540;
        proxy_send_timeout 3540;
        proxy_read_timeout 3540;
        proxy_buffering off;
    }
}
