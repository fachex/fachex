# Dedicated front proxy vhost — email.opennube.net
#
# Two-layer design: this proxy terminates public TLS (via Certbot) and forwards
# EVERYTHING to the nginx running INSIDE the SOGo container (172.17.17.99:80),
# which serves SOGo's static WebServerResources locally and proxies the app to
# the daemon. So this proxy is intentionally "dumb": no /SOGo redirect, no
# x-webobjects-* headers (the container nginx owns all of that and emits https://
# URLs). It only needs Host + X-Forwarded-Proto:https.
#
# TLS lines below are managed by Certbot (certbot --nginx -d email.opennube.net).

server {
    server_name email.opennube.net;

    location / {
        proxy_pass http://172.17.17.99:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;        # ActiveSync long-poll
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/email.opennube.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/email.opennube.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = email.opennube.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name email.opennube.net;
    return 404; # managed by Certbot
}
