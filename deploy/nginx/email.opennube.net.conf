# SOGo reverse-proxy vhost — email.opennube.net
#
# Topology: this nginx is a SEPARATE host from SOGo (dedicated proxy on VLAN 12).
# SOGo's internal server (CT 902, 172.17.17.99) speaks PLAIN HTTP on :20000, and
# serves its own WebServerResources — so we proxy everything to it (no local
# `alias`, which only works when nginx is co-located with SOGo).
#
# Adjust: cert paths (step below), and the backend IP if SOGo moves.

# --- HTTP: ACME + redirect to HTTPS ------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name email.opennube.net autodiscover.opennube.net autoconfig.opennube.net;

    # Let's Encrypt http-01 webroot (if you issue certs on this proxy)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: proxy to SOGo -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name email.opennube.net autodiscover.opennube.net autoconfig.opennube.net;

    ssl_certificate     /etc/letsencrypt/live/email.opennube.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/email.opennube.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;          # large attachments
    proxy_connect_timeout 75s;

    # WebObjects headers SOGo needs behind a proxy (these fix the unstyled page)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header x-webobjects-server-protocol "HTTP/1.0";
    proxy_set_header x-webobjects-remote-host $remote_addr;
    proxy_set_header x-webobjects-server-name $host;
    proxy_set_header x-webobjects-server-url "https://$host";
    proxy_set_header x-webobjects-server-port "443";

    location / { return 302 https://$host/SOGo; }

    # App + its WebServerResources (prefix match also covers /SOGo.woa/...)
    location /SOGo {
        proxy_pass http://172.17.17.99:20000;   # PLAIN HTTP backend
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # ActiveSync (EAS) for phones — long-lived connections
    location /Microsoft-Server-ActiveSync {
        proxy_pass http://172.17.17.99:20000/SOGo/Microsoft-Server-ActiveSync;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3540s;
        proxy_connect_timeout 3540s;
    }

    # Autodiscover/autoconfig so clients self-configure
    location ~* ^/(Autodiscover|autodiscover|AutoDiscover)/ {
        proxy_pass http://172.17.17.99:20000/SOGo/Autodiscover/;
        proxy_buffering off;
    }
}
