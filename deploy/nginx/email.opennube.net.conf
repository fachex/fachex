# Dedicated front proxy vhost — email.opennube.net
#
# Two-layer design: this proxy terminates public TLS and forwards to the nginx
# running INSIDE the SOGo container (172.17.17.99:80), which serves SOGo's
# static WebServerResources locally and proxies the app to the daemon. That's
# why this file does NOT reference :20000 or any /usr/lib/GNUstep path — the
# proxy has no SOGo files. See deploy/sogo/nginx-sogo.conf.

server {
    listen 80;
    listen [::]:80;
    server_name email.opennube.net;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name email.opennube.net;

    ssl_certificate     /etc/letsencrypt/live/email.opennube.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/email.opennube.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://172.17.17.99:80;        # -> container nginx (NOT :20000)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # tells container nginx public scheme
        proxy_buffering off;
        proxy_read_timeout 3600s;                  # ActiveSync long-poll
    }
}
