# SOGo reverse-proxy vhost — email.opennube.net
#
# Drop on the FRONT nginx proxy (the one that already fronts Hestia/Roundcube).
# This does NOT touch webmail.<domain> — that keeps going to Roundcube/Hestia.
# Adjust:
#   - SOGO_BACKEND      -> IP:port of the SOGo LXC (SOGo listens on 20000 by default)
#   - ssl_certificate*  -> your cert paths (Let's Encrypt example below)
#   - server_name       -> add more hosts (email.opennube.ai, ...) to reuse this
#
# Pattern follows the official SOGo nginx guidance: pass the WebObjects headers,
# disable buffering, allow large bodies, and give ActiveSync long timeouts.

upstream sogo_backend {
    server 172.17.17.99:20000;  # <-- SOGO_BACKEND: the SOGo LXC (CTID 902)
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name email.opennube.net autodiscover.opennube.net autoconfig.opennube.net;
    location / { return 301 https://$host$request_uri; }

    # Allow ACME http-01 renewals if you issue certs on this proxy
    location /.well-known/acme-challenge/ { root /var/www/acme; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name email.opennube.net autodiscover.opennube.net autoconfig.opennube.net;

    # TLS (Let's Encrypt example)
    ssl_certificate     /etc/letsencrypt/live/email.opennube.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/email.opennube.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Big attachments + long-lived ActiveSync connections
    client_max_body_size 100m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_connect_timeout 75s;

    # WebObjects headers SOGo needs behind a proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header x-webobjects-server-protocol "HTTP/1.0";
    proxy_set_header x-webobjects-remote-host $remote_addr;
    proxy_set_header x-webobjects-server-name $server_name;
    proxy_set_header x-webobjects-server-url "https://$host";
    proxy_set_header x-webobjects-server-port "443";

    # Root -> SOGo
    location / { return 302 https://$host/SOGo; }

    location /SOGo {
        proxy_pass http://sogo_backend;
        proxy_buffering off;
        break;
    }

    # SOGo static assets
    location /SOGo.woa/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }
    location /SOGo/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }

    # ActiveSync (EAS) for phones — needs the long timeouts above
    location /Microsoft-Server-ActiveSync {
        proxy_pass http://sogo_backend/SOGo/Microsoft-Server-ActiveSync;
        proxy_buffering off;
        proxy_read_timeout 3540s;   # just under SOGo's WOWatchDogRequestTimeout
        proxy_connect_timeout 3540s;
    }

    # Autodiscover/autoconfig so clients self-configure
    location ~* ^/(Autodiscover|autodiscover|AutoDiscover)/ {
        proxy_pass http://sogo_backend/SOGo/Autodiscover/;
        proxy_buffering off;
    }
}
